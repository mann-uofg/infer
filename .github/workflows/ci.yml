name: ci

on:
  push:
  pull_request:

# The workflow only reads the repository; it needs no other access.
permissions:
  contents: read

jobs:
  # Hosted runners have no GPU or CUDA toolkit, so this covers the CPU-side code only.
  # GPU tests run locally.
  build-test:
    name: ${{ matrix.cxx }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        preset: [debug, release]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # The PyTorch reference against Hugging Face transformers, on the tiny random model.
  # The full-size checks need the model files and a GPU, so they run locally.
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch and the other requirements
        run: |
          pip install torch==$(grep '^torch==' requirements.txt | cut -d= -f3) \
            --index-url https://download.pytorch.org/whl/cpu
          pip install $(grep -v '^torch==' requirements.txt | grep -v '^#')
      - name: Test
        run: python -m pytest -q

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: clang-format check
        run: git ls-files '*.h' '*.cpp' '*.cu' '*.cuh' | xargs -r clang-format --dry-run --Werror
